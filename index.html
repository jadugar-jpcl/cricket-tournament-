<script>(()=>{
'use strict';
const URL='https://gtejszzykjzogryxtkng.supabase.co';
const KEY='sb_publishable_UaeSuItVM2PnkGGWxDYL4A_jsvJP9Zk';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const color=s=>/^#[a-fA-F0-9]{6}$/.test(String(s||''))?s:'#c6fb63';
const imageURL=s=>{try{const u=new URL(String(s||''));return u.protocol==='https:'?u.href:'';}catch{return ''}};
const D={name:'Jadugar Paltalk Cricket League',short_name:'JPCL',season:'SEASON 01',tagline:'Official Tournament Hub',announcement:'',editor:{}};
const TEXT_GROUPS={
 'Homepage':[['heroEyebrow','Hero small heading','OFFICIAL TOURNAMENT HUB'],['hero1','Hero heading first line','EVERY RUN.'],['hero2','Hero heading second line','EVERY RIVALRY.'],['hero3','Hero highlighted line','EVERY RESULT.'],['heroDescription','Hero description','Official fixtures, match results and team information for the Jadugar Paltalk Cricket League.'],['heroAction1','First button','See fixtures'],['heroAction2','Second button','Points tables'],['homeResults','Home results title','Recent results'],['homeStandings','Home standings title','Current standings'],['homeUpcoming','Home upcoming title','Next fixtures'],['bannerTitle','Bottom banner title','THE LEAGUE. THE MOMENTS. THE GLORY.'],['bannerDescription','Bottom banner description','Official JPCL tournament news, results and announcements.'],['bannerButton','Bottom banner button','Admin dashboard']],
 'Public pages':[['matchesTitle','Matches page title','FIXTURES & RESULTS'],['matchesDescription','Matches page description','Match schedules and official results published by JPCL.'],['standingsTitle','Points tables page title','THE POINTS TABLES'],['standingsDescription','Points tables description','Independent standings for each round, updated automatically after results.'],['teamsTitle','Teams page title','OUR TEAMS & SQUADS'],['teamsDescription','Teams and their registered players.'],['playersTitle','Players page title','PLAYER LEADERBOARDS'],['playersDescription','Runs, wickets and catches from official match records.']],
 'Footer and metadata':[['footer','Footer credit','Managed by JPCL.'],['announcementTitle','Announcement heading','LEAGUE ANNOUNCEMENT'],['seo','Search engine description','JPCL official cricket tournament fixtures, results, teams and rankings.']]
};
const BASE_NAV=[['overview','Home'],['matches','Matches'],['standings','Points Table'],['teams','Teams'],['players','Player Stats']];
const T={page:'overview',menu:false,tab:'results',filter:'all',admin:false,session:null,mode:'loading',message:'',messageType:'ok',settings:{...D},teams:[],matches:[],players:[],player_performances:[],edits:{},selectedMatch:'',editingPage:null};
let db=null;
const cfg=()=>T.settings;
const cms=()=>cfg().editor||{};
const tx=(key)=>{for(const items of Object.values(TEXT_GROUPS)){const item=items.find(x=>x[0]===key);if(item)return String(cms().text?.[key]??item[2]);}return ''};
const text=(key)=>esc(tx(key));
const nav=()=>[...BASE_NAV.map(([id,label])=>({id,label:cms().nav?.[id]?.label||label,visible:cms().nav?.[id]?.visible!==false})),...(cms().pages||[]).filter(x=>x&&/^custom_[a-z0-9_]+$/.test(x.id)).map(p=>({id:p.id,label:p.title,visible:p.visible!==false}))];
const team=id=>T.teams.find(x=>x.id===id)||{name:'Unknown',short_name:'?',color:'#e4e8ed'};
const player=id=>T.players.find(x=>x.id===id)||{name:'Unknown'};
const short=t=>esc(t.short_name||'?');
const dateStr=s=>s?new Date(s).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Date TBA';
const scored=m=>m.status==='completed';
const rounds=()=>{
 let map=new Map();for(const m of T.matches){const st=String(m.stage||'Round 1').trim();if(st&&!/^(final|semi.?final|quarter.?final|playoffs?|knockout)$/i.test(st))map.set(st.toLowerCase(),st)}
 for(const r of cms().rounds||[]){if(typeof r==='string'&&r.trim())map.set(r.trim().toLowerCase(),r.trim())}
 return [...map.values()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
};
const pointValue=k=>Number(cms().scoring?.[k]??(k==='win'?2:1));
const calcTable=(matches,stage,combined=false)=>{
 const teams=new Set(matches.flatMap(m=>[m.team1_id,m.team2_id]));
 if(!matches.length)T.teams.forEach(t=>teams.add(t.id));
 const extras=cms().adjustments||{};
 const stages=combined?rounds().map(x=>x.toLowerCase()):[String(stage||'').toLowerCase()];
 for(const st of stages)for(const tid of Object.keys(extras[st]||{}))teams.add(tid);
 const map=new Map(T.teams.filter(t=>teams.has(t.id)).map(t=>[t.id,{team:t,p:0,w:0,l:0,t:0,pts:0}]));
 for(const m of matches.filter(scored)){
  const a=map.get(m.team1_id),b=map.get(m.team2_id);if(!a||!b)continue;a.p++;b.p++;
  if(m.winner_id===a.team.id){a.w++;b.l++;a.pts+=pointValue('win')}
  else if(m.winner_id===b.team.id){b.w++;a.l++;b.pts+=pointValue('win')}
  else{a.t++;b.t++;a.pts+=pointValue('tie');b.pts+=pointValue('tie')}
 }
 for(const st of stages)for(const [tid,extra] of Object.entries(extras[st]||{})){const r=map.get(tid);if(r)r.pts+=Number(extra)||0}
 return [...map.values()].sort((a,b)=>b.pts-a.pts||b.w-a.w||a.team.name.localeCompare(b.team.name));
};
const allCompleted=()=>T.matches.filter(scored);
const sortedMatches=()=>[...T.matches].sort((a,b)=>String(a.scheduled_at||a.created_at||'').localeCompare(String(b.scheduled_at||b.created_at||'')));
const performance=p=>{const a=T.player_performances.filter(x=>x.player_id===p.id);return {p,played:a.length,runs:a.reduce((s,x)=>s+(x.runs||0),0),wickets:a.reduce((s,x)=>s+(x.wickets||0),0),catches:a.reduce((s,x)=>s+(x.catches||0),0)}};
const sbtn=(name,action,cls='ghost')=>`<button type="button" class="btn small ${cls}" data-action="${esc(action)}">${esc(name)}</button>`;
const empty=message=>`<div class="empty">🏏<div style="margin-top:9px">${esc(message)}</div></div>`;
const banner=()=>`<div class="banner"><div><h3>${text('bannerTitle')}</h3><p>${text('bannerDescription')}</p></div><button class="btn primary" data-page="admin">${text('bannerButton')} ↗</button></div>`;
const flash=()=>T.message?`<div class="note ${T.messageType==='error'?'error':''}">${esc(T.message)}</div>`:'';
const status=m=>m.status==='completed'?'FINAL':m.status==='live'?'● LIVE':'UPCOMING';
const crest=t=>`<div class="team-crest" style="background:${color(t.color)}">${short(t)}</div>`;
const score=m=>m.team1_runs==null?'—':`${esc(m.team1_runs)}/${esc(m.team1_wickets??0)}`;
const score2=m=>m.team2_runs==null?'—':`${esc(m.team2_runs)}/${esc(m.team2_wickets??0)}`;
const matchLine=m=>`<article class="match"><div class="match-top"><span>${esc(m.stage||'League match')} · ${esc(dateStr(m.scheduled_at))}</span><span class="badge ${m.status==='live'?'live':m.status==='upcoming'?'gray':''}">${status(m)}</span></div><div class="match-score"><span class="side">${crest(team(m.team1_id))}<span>${esc(team(m.team1_id).name)}</span></span><span class="score">${score(m)} <span style="color:#b1bdcb">:</span> ${score2(m)}</span><span class="side">${crest(team(m.team2_id))}<span>${esc(team(m.team2_id).name)}</span></span></div><div class="match-bottom"><span>${esc(m.result_summary|| (m.status==='completed'?'Result published':m.status==='live'?'In progress':'Scheduled fixture'))}</span>${m.winner_id?`<b>Winner: ${esc(team(m.winner_id).name)}</b>`:''}</div></article>`;
const table=rows=>rows.length?`<div class="table-scroll"><table class="standings"><thead><tr><th>#</th><th>TEAM</th><th>P</th><th>W</th><th>L</th><th>T</th><th>PTS</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td class="rank">${i+1}</td><td><div class="team-tile">${crest(x.team)}<b>${esc(x.team.name)}</b></div></td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td><td>${x.pts}</td></tr>`).join('')}</tbody></table></div>`:empty('Teams and results will appear here.');
const section=(title,kicker,inside,action)=>`<div class="section-title"><div><div class="kicker">${esc(kicker)}</div><h2>${esc(title)}</h2></div>${action?`<button data-page="${action}">See all →</button>`:''}</div><div class="card">${inside}</div>`;
const pagehead=(title,desc,kicker)=>`<div class="pagehead"><div class="kicker">${esc(kicker||cfg().season)}</div><h1>${esc(title)}</h1><p>${esc(desc||'')}</p></div>`;
function header(){return `<header class="topbar"><div class="container header"><a href="#" class="brand" data-page="overview"><span class="mark">${imageURL(cms().theme?.logo)?`<img src="${esc(imageURL(cms().theme.logo))}" alt="JPCL logo">`:esc(cfg().short_name.slice(0,2))}</span><span class="brand-text"><b>${esc(cfg().short_name)}</b><small>${esc(cfg().name)}</small></span></a><nav class="nav ${T.menu?'open':''}">${nav().filter(x=>x.visible).map(x=>`<button data-page="${esc(x.id)}" class="${T.page===x.id?'active':''}">${esc(x.label)}</button>`).join('')}</nav><button class="adminlink" data-page="admin">${T.admin?'⚙ Admin':'🔐 Admin Login'}</button><button class="hamb" data-action="menu" aria-label="Open menu">☰</button></div></header>`}
function footer(){return `<footer class="footer"><div class="container footer-inner"><div><strong>${esc(cfg().short_name)}.</strong><p>${esc(cfg().tagline)} · ${esc(cfg().season)}</p></div><small>${text('footer')}</small></div></footer>`}
function home(){const m=T.matches.find(m=>m.status==='live')||T.matches.find(m=>m.status==='upcoming')||T.matches[0];const completed=sortedMatches().filter(scored).reverse().slice(0,3);const upcoming=sortedMatches().filter(m=>m.status!=='completed').slice(0,3);const rnd=rounds()[0];return `<section class="hero">${imageURL(cms().theme?.heroImage)?`<img class="hero-photo" src="${esc(imageURL(cms().theme.heroImage))}" alt="">`:''}<div class="container hero-in"><div><div class="eyebrow">${text('heroEyebrow')}</div><h1>${text('hero1')}<br>${text('hero2')}<br><em>${text('hero3')}</em></h1><p>${text('heroDescription')}</p><div class="actions"><button class="btn primary" data-page="matches">${text('heroAction1')} ↗</button><button class="btn outline" data-page="standings">${text('heroAction2')} →</button></div></div><div class="feature"><span class="micro">THE MATCH CENTRE</span><h2>${m?esc(m.stage):'COMING SOON'}</h2>${m?`<div class="versus"><b>${esc(team(m.team1_id).short_name)}</b><em>VS</em><b>${esc(team(m.team2_id).short_name)}</b></div><p>${esc(dateStr(m.scheduled_at))} · ${status(m)}</p>`:'<p>Fixtures and results will appear here when the tournament starts.</p>'}</div></div></section><div class="container"><div class="metrics">${[['Teams',T.teams.length],['Matches',T.matches.length],['Completed',allCompleted().length],['Players',T.players.length]].map(([k,v])=>`<div class="metric"><b>${v}</b><span>${k}</span></div>`).join('')}</div>${cfg().announcement?`<div class="note" style="margin-top:22px"><strong>${text('announcementTitle')}:</strong> ${esc(cfg().announcement)}</div>`:''}<main class="main"><div class="grid2"><div>${section(tx('homeResults'),'OFFICIAL RESULTS',completed.length?completed.map(matchLine).join(''):empty('Results will appear once matches are played.'),'matches')}</div><div>${section(tx('homeStandings'),'THE RACE',table(calcTable(T.matches.filter(x=>(x.stage||'').toLowerCase()===(rnd||'').toLowerCase()),rnd)),'standings')}</div></div>${section(tx('homeUpcoming'),'WHAT’S NEXT',upcoming.length?upcoming.map(matchLine).join(''):empty('No upcoming fixtures yet.'),'matches')}${banner()}</main></div>`}
function matchesPage(){const list=sortedMatches().filter(m=>T.filter==='all'||m.status===T.filter);return `<main class="main"><div class="container">${pagehead(tx('matchesTitle'),tx('matchesDescription'),'THE MATCH CENTRE')}<div class="select-tabs" style="margin:14px 0">${[['all','All matches'],['upcoming','Upcoming'],['live','Live'],['completed','Results']].map(([id,label])=>`<button class="${T.filter===id?'active':''}" data-filter="${id}">${label}</button>`).join('')}</div><div class="card">${list.length?list.map(matchLine).join(''):empty('No matches for this filter yet.')}</div>${banner()}</div></main>`}
function standingsPage(){const all=rounds();return `<main class="main"><div class="container">${pagehead(tx('standingsTitle'),tx('standingsDescription'),'LEAGUE RANKINGS')}${all.length?all.map(r=>{const ms=T.matches.filter(m=>(m.stage||'').toLowerCase()===r.toLowerCase());return `<section class="card round"><h2>${esc(r)} — POINTS TABLE <span style="font:700 11px 'DM Sans';color:#748197;margin-left:8px">${ms.filter(scored).length} / ${ms.length} matches</span></h2>${table(calcTable(ms,r))}</section>`}).join(''):`<section class="card round"><h2>POINTS TABLE</h2>${table(calcTable(T.matches,''))}</section>`}${all.length>1&&cms().showCombined!==false?`<section class="card round"><h2>ALL ROUNDS COMBINED</h2>${table(calcTable(T.matches,'',true))}</section>`:''}<div class="note">Scoring: ${pointValue('win')} for a win, ${pointValue('tie')} for a tie. Points tables are independent for each round.</div></div></main>`}
function teamsPage(){return `<main class="main"><div class="container">${pagehead(tx('teamsTitle'),tx('teamsDescription'),'MEET THE COMPETITORS')}<div class="grid3">${T.teams.map(t=>{const squad=T.players.filter(p=>p.team_id===t.id).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="card"><div class="squad-head">${crest(t)}<div><strong>${esc(t.name)}</strong><small>${esc(t.short_name)} · ${squad.length} player(s)</small></div></div>${squad.length?`<ol class="squad-list">${squad.map(p=>`<li><b>${esc(p.name)}</b><small>${esc(p.role)}</small></li>`).join('')}</ol>`:empty('No players registered yet.')}</div>`}).join('')||`<div class="card">${empty('Teams will appear here.')}</div>`}</div>${banner()}</div></main>`}
function playersPage(){const ps=T.players.map(performance);const ranking=(key,label)=>section(label,'OFFICIAL RANKINGS',ps.sort((a,b)=>b[key]-a[key]).slice(0,15).map((x,i)=>`<div class="stat-row"><span><b style="color:#8b9bb0">${i+1}.</b> <strong>${esc(x.p.name)}</strong><small> · ${esc(team(x.p.team_id).name)}</small></span><span class="numbers">${x[key]} ${key==='runs'?'runs':key}</span></div>`).join('')||empty('Players will appear here.'));return `<main class="main"><div class="container">${pagehead(tx('playersTitle'),tx('playersDescription'),'INDIVIDUAL PERFORMANCES')}<div class="grid3">${ranking('runs','Top run scorers')}${ranking('wickets','Top wicket takers')}${ranking('catches','Top catches')}</div>${banner()}</div></main>`}
function customPage(){const p=(cms().pages||[]).find(p=>p.id===T.page);return `<main class="main"><div class="container">${pagehead(p?.title||'Page','',cfg().season)}<article class="card prose">${esc(p?.body||'Content coming soon.')}</article></div></main>`}
function loginPage(){return `<main class="main"><div class="container"><div class="card pad auth-card"><div class="kicker" style="color:#5c8c23">JPCL ADMIN</div><h2>ADMIN LOGIN</h2><p style="font-size:12px;color:#657389">Sign in using your approved JPCL admin email and password.</p>${flash()}<form id="login-form"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:14px"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button type="submit" class="btn primary" style="width:100%;margin-top:18px">Sign in securely</button></form></div></div></main>`}
const f=(label,key,val='',type='text',attrs='')=>`<div class="field"><label for="in_${esc(key)}">${esc(label)}</label><input id="in_${esc(key)}" name="${esc(key)}" type="${esc(type)}" value="${esc(val)}" ${attrs}></div>`;
const ta=(label,key,val='',rows=3)=>`<div class="field"><label for="in_${esc(key)}">${esc(label)}</label><textarea id="in_${esc(key)}" name="${esc(key)}" rows="${rows}">${esc(val)}</textarea></div>`;
const sel=(label,key,opts,chosen,placeholder='Choose')=>`<div class="field"><label for="in_${esc(key)}">${esc(label)}</label><select id="in_${esc(key)}" name="${esc(key)}"><option value="">${esc(placeholder)}</option>${opts.map(([id,name])=>`<option value="${esc(id)}" ${String(id)===String(chosen)?'selected':''}>${esc(name)}</option>`).join('')}</select></div>`;
const chk=(label,key,on)=>`<label class="check"><input name="${esc(key)}" type="checkbox" value="yes" ${on?'checked':''}> ${esc(label)}</label>`;
const sb=(name)=>`<button class="btn primary" type="submit">${esc(name)}</button>`;
const optsTeams=()=>T.teams.map(t=>[t.id,t.name]);
const optsMatches=()=>sortedMatches().map(m=>[m.id,`${team(m.team1_id).short_name} vs ${team(m.team2_id).short_name} · ${m.stage}`]);
const optsPlayers=()=>T.players.map(p=>[p.id,`${p.name} (${team(p.team_id).short_name})`]);
const editItem=(table)=>T[table].find(row=>row.id===T.edits[table]);
const item=(title,subtitle,buttons)=>`<div class="admin-item"><div><strong>${esc(title)}</strong><small>${esc(subtitle)}</small></div><div class="ctrl">${buttons}</div></div>`;
const act=(label,action,id,kind='ghost')=>`<button class="btn small ${kind}" data-action="${esc(action)}" data-id="${esc(id)}">${esc(label)}</button>`;
function tabSettings(){return `<div class="form-card"><h3>Website settings</h3><p>Edit the official name, season and the announcement shown on the homepage.</p><form id="settings-form"><div class="form-grid">${f('Tournament name','name',cfg().name,'text','required maxlength="90"')}${f('Short name','short_name',cfg().short_name,'text','required maxlength="12"')}${f('Season','season',cfg().season,'text','maxlength="40"')}${f('Tagline','tagline',cfg().tagline,'text','maxlength="140"')}<div class="wide">${ta('Homepage announcement','announcement',cfg().announcement,3)}</div></div>${sb('Save website settings')}</form></div>`}
function tabContent(){return `<div class="form-card"><h3>Public text editor</h3><p>Update every listed heading, description and button label. Changes appear on the public site after Save.</p><form id="content-form">${Object.entries(TEXT_GROUPS).map(([group,items])=>`<h4>${esc(group)}</h4><div class="form-grid">${items.map(([key,label,value])=>key.toLowerCase().includes('description')||key==='heroDescription'||key==='bannerDescription'||key==='seo'?`<div class="wide">${ta(label,key,cms().text?.[key]??value,2)}</div>`:f(label,key,cms().text?.[key]??value,'text','maxlength="1500"')).join('')}</div>`).join('')}${sb('Save public page text')}</form></div>`}
function tabDesign(){const d=cms().theme||{};return `<div class="form-card"><h3>Colours, logo and images</h3><p>Logo and hero images use publicly accessible HTTPS URLs. Leave either URL empty to use the built-in artwork.</p><form id="design-form"><div class="form-grid">${f('Accent colour','accent',d.accent||'#c6fb63','color')}${f('Background colour','paper',d.paper||'#f3f6fa','color')}${f('Dark header colour','dark',d.dark||'#0b1429','color')}${f('Logo image URL','logo',d.logo||'','url','placeholder="https://..."')}${f('Homepage background image URL','heroImage',d.heroImage||'','url','placeholder="https://..."')}</div>${sb('Save design')}</form></div>`}
function tabNav(){return `<div class="form-card"><h3>Navigation menu</h3><p>Rename or hide public menu items. The Admin Login button is always available.</p><form id="nav-form"><div class="split">${BASE_NAV.map(([id,label])=>`<div class="menu-edit">${f(`${label} — menu label`,'label_'+id,cms().nav?.[id]?.label||label,'text','maxlength="40"')}${chk('Show in menu','show_'+id,cms().nav?.[id]?.visible!==false)}</div>`).join('')}</div>${sb('Save navigation')}</form></div>`}
function tabPages(){const p=(cms().pages||[]).find(x=>x.id===T.editingPage);return `<div class="form-card"><h3>${p?'Edit':'Create'} information page</h3><p>Add custom pages for rules, prizes, sponsors or any informational content.</p><form id="page-form"><div class="form-grid">${f('Page title','title',p?.title||'','text','required maxlength="70"')}<div class="wide">${ta('Page text','body',p?.body||'',9)}</div></div>${chk('Show in main menu','visible',p?.visible!==false)}<div class="actions">${sb(p?'Save page':'Create page')}${p?act('Cancel','cancel-page',''):''}</div></form></div><div class="form-card"><h3>Existing information pages</h3>${(cms().pages||[]).map(p=>item(p.title,p.visible===false?'Hidden from menu':'Visible in menu',act('Edit','edit-page',p.id)+act('Delete','delete-page',p.id,'danger'))).join('')||empty('No extra pages yet.')}</div>`}
function tabTeams(){const a=editItem('teams');return `<div class="form-card"><h3>${a?'Edit':'Add'} team</h3><p>Team name, short code and colour appear throughout the website.</p><form id="team-form"><div class="form-grid">${f('Team name','name',a?.name||'','text','required maxlength="70"')}${f('Short code (2–5 letters)','short_name',a?.short_name||'','text','required minlength="2" maxlength="5"')}${f('Team colour','color',a?.color||'#c6fb63','color')}</div><div class="actions">${sb(a?'Save team':'Add team')}${a?act('Cancel','cancel-edit','teams'):''}</div></form></div><div class="form-card"><h3>Registered teams (${T.teams.length})</h3>${T.teams.map(t=>item(t.name,`${t.short_name} · ${T.players.filter(p=>p.team_id===t.id).length} players`,act('Add players','add-player-team',t.id)+act('Edit','edit','teams:'+t.id)+act('Delete','delete','teams:'+t.id,'danger'))).join('')||empty('Add your first team to get started.')}</div>`}
function tabPlayers(){const a=editItem('players');return `<div class="form-card"><h3>${a?'Edit':'Add'} player</h3><p>Assign each player to a team. Their name then appears in that team's public squad.</p><form id="player-form"><div class="form-grid">${f('Player name','name',a?.name||'','text','required maxlength="80"')}${sel('Team','team_id',optsTeams(),a?.team_id||T.edits.defaultTeam,'Select team')}${f('Role','role',a?.role||'Player','text','maxlength="40"')}</div><div class="actions">${sb(a?'Save player':'Add player')}${a?act('Cancel','cancel-edit','players'):''}</div></form></div><div class="form-card"><h3>Registered players (${T.players.length})</h3>${T.players.map(p=>item(p.name,`${team(p.team_id).name} · ${p.role}`,act('Edit','edit','players:'+p.id)+act('Delete','delete','players:'+p.id,'danger'))).join('')||empty('Players can be added after teams.')}</div>`}
function tabFixtures(){const a=editItem('matches');const current=a?.scheduled_at?new Date(a.scheduled_at).toISOString().slice(0,16):'';return `<div class="form-card"><h3>${a?'Edit':'Add'} fixture</h3><p>Enter a round name such as <b>Round 2</b> to create its own points table automatically.</p><form id="fixture-form"><div class="form-grid">${sel('Team A','team1_id',optsTeams(),a?.team1_id)}${sel('Team B','team2_id',optsTeams(),a?.team2_id)}${f('Round or stage','stage',a?.stage||'Round 1','text','required maxlength="80" list="round-names"')}<datalist id="round-names">${[...new Set(['Round 1','Round 2','Round 3',...rounds()])].map(r=>`<option value="${esc(r)}"></option>`).join('')}</datalist>${f('Schedule (optional)','scheduled_at',current,'datetime-local')}</div><div class="actions">${sb(a?'Save fixture':'Add fixture')}${a?act('Cancel','cancel-edit','matches'):''}</div></form></div><div class="form-card"><h3>Fixtures (${T.matches.length})</h3>${sortedMatches().map(m=>item(`${team(m.team1_id).short_name} vs ${team(m.team2_id).short_name}`,`${m.stage} · ${status(m)} · ${dateStr(m.scheduled_at)}`,act('Edit','edit','matches:'+m.id)+act('Score','score-match',m.id)+act('Delete','delete','matches:'+m.id,'danger'))).join('')||empty('Add teams first, then create fixtures.')}</div>`}
function tabResults(){const m=T.matches.find(x=>x.id===T.selectedMatch)||sortedMatches()[0];const opts=(id)=>T.teams.filter(t=>t.id===m?.team1_id||t.id===m?.team2_id).map(t=>[t.id,t.name]);return `<div class="form-card"><h3>Enter or correct match result</h3><p>Results instantly update the public page and the correct round standings.</p>${m?`<form id="result-form">${sel('Select match','match_id',optsMatches(),m.id)}<div class="form-grid">${sel('Match status','status',[['upcoming','Upcoming'],['live','Live'],['completed','Completed']],m.status)}${sel('Winner (leave blank for tie)','winner_id',opts(),m.winner_id)}${f(`${team(m.team1_id).short_name} runs`,'team1_runs',m.team1_runs??'','number','min="0" max="9999"')}${f(`${team(m.team1_id).short_name} wickets`,'team1_wickets',m.team1_wickets??'','number','min="0" max="10"')}${f(`${team(m.team1_id).short_name} overs`,'team1_overs',m.team1_overs??'','number','min="0" max="999.5" step="0.1"')}${f(`${team(m.team2_id).short_name} runs`,'team2_runs',m.team2_runs??'','number','min="0" max="9999"')}${f(`${team(m.team2_id).short_name} wickets`,'team2_wickets',m.team2_wickets??'','number','min="0" max="10"')}${f(`${team(m.team2_id).short_name} overs`,'team2_overs',m.team2_overs??'','number','min="0" max="999.5" step="0.1"')}<div class="wide">${ta('Result summary','result_summary',m.result_summary||'',3)}</div></div>${sb('Save match result')}</form>`:empty('Create a fixture first.')} </div><div class="form-card"><h3>Recorded matches</h3>${sortedMatches().map(x=>item(`${team(x.team1_id).short_name} vs ${team(x.team2_id).short_name}`,`${x.stage} · ${status(x)}`,act('Score','score-match',x.id))).join('')||empty('No fixtures.')}</div>`}
function tabStats(){return `<div class="form-card"><h3>Player match statistics</h3><p>Saving the same player and match again updates the recorded statistics.</p><form id="stats-form"><div class="form-grid">${sel('Match','match_id',optsMatches(),T.edits.statMatch)}${sel('Player','player_id',optsPlayers(),T.edits.statPlayer)}${f('Runs','runs',0,'number','required min="0" max="9999"')}${f('Wickets','wickets',0,'number','required min="0" max="10"')}${f('Catches','catches',0,'number','required min="0" max="10"')}</div>${sb('Save player statistics')}</form></div><div class="form-card"><h3>Saved records</h3>${T.player_performances.map(x=>item(player(x.player_id).name,`${x.runs} runs · ${x.wickets} wickets · ${x.catches} catches`,act('Edit','edit-stat',x.id)+act('Delete','delete','player_performances:'+x.id,'danger'))).join('')||empty('No player statistics yet.')}</div>`}
function tabRounds(){const names=rounds();const rows=Object.entries(cms().adjustments||{}).flatMap(([stage,obj])=>Object.entries(obj||{}).filter(([,v])=>Number(v)).map(([tid,val])=>({stage,tid,val})));return `<div class="form-card"><h3>Independent round tables</h3><p>Create Round 2, Round 3 or any round without adding matches first.</p><form id="round-form">${f('New round name','round_name','','text','required maxlength="80"')}${sb('Create points table')}</form><div style="margin-top:13px">${(cms().rounds||[]).map(r=>item(r,'Standalone table',act('Remove','delete-round',r,'danger'))).join('')||'<p class="adminhint">Rounds with fixtures are created automatically.</p>'}</div></div><div class="form-card"><h3>Scoring rules</h3><form id="rules-form"><div class="form-grid">${f('Points for win','win',pointValue('win'),'number','required min="0" max="100"')}${f('Points for tie','tie',pointValue('tie'),'number','required min="0" max="100"')}</div>${chk('Show all-rounds combined table','show_combined',cms().showCombined!==false)}${sb('Save points rules')}</form></div><div class="form-card"><h3>Points adjustments</h3><p>Add bonus points or deductions for a team in a selected round. Enter 0 to remove the adjustment.</p><form id="adjust-form"><div class="form-grid">${sel('Round','stage',names.map(x=>[x,x]),'')}${sel('Team','team_id',optsTeams(),'')}${f('Bonus (+) or penalty (-)','delta',0,'number','required min="-100" max="100"')}</div>${sb('Save points adjustment')}</form>${rows.map(x=>item(team(x.tid).name,`${x.stage} · ${x.val} points`,act('Remove','remove-adjust',x.stage+'|'+x.tid,'danger'))).join('')}</div>`}
const TABS=[['results','🏏 Results'],['fixtures','▦ Fixtures'],['teams','⚑ Teams'],['players','♙ Players'],['stats','◈ Player Stats'],['rounds','🏆 Points Tables'],['settings','⚙ Site Settings'],['content','✏ Page Content'],['design','🎨 Design'],['nav','☰ Menu'],['pages','▤ Extra Pages']];
const TAB_FN={results:tabResults,fixtures:tabFixtures,teams:tabTeams,players:tabPlayers,stats:tabStats,rounds:tabRounds,settings:tabSettings,content:tabContent,design:tabDesign,nav:tabNav,pages:tabPages};
function adminPage(){if(!T.admin)return loginPage();return `<main class="main"><div class="container">${pagehead('ADMIN DASHBOARD','Manage the entire JPCL website from here — no code editing required.','TOURNAMENT CONTROL CENTRE')}${flash()}<div class="admin-layout"><div class="admin-menu">${TABS.map(([id,label])=>`<button class="${T.tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}<button data-action="logout">⇤ Sign out</button></div><div><div class="admin-header"><h2>${esc(TABS.find(x=>x[0]===T.tab)?.[1]||'Admin')}</h2><span class="badge">ADMIN ONLY</span></div>${(TAB_FN[T.tab]||tabResults)()}</div></div></div></main>`}
function draw(){const t=cms().theme||{};document.documentElement.style.setProperty('--accent',color(t.accent||'#c6fb63'));document.documentElement.style.setProperty('--bg',color(t.paper||'#f3f6fa'));document.documentElement.style.setProperty('--dark',color(t.dark||'#0b1429'));const pt=(cms().pages||[]).find(x=>x.id===T.page);document.title=`${cfg().short_name||'JPCL'} | ${pt?.title||(T.page==='overview'?'Tournament Hub':T.page)}`;const title=document.querySelector('meta[name="description"]');if(title)title.content=tx('seo');const pages={overview:home,matches:matchesPage,standings:standingsPage,teams:teamsPage,players:playersPage,admin:adminPage};$('app').innerHTML=header()+(pages[T.page]||customPage)()+footer();}
function go(page){T.page=page;T.menu=false;T.message='';draw();scrollTo({top:0,behavior:'instant'})}
function alert(msg,type='ok'){T.message=msg;T.messageType=type;draw()}
function numeric(v,max=9999){if(v===''||v==null)return null;const n=Number(v);if(!Number.isInteger(n)||n<0||n>max)throw Error('Enter valid non-negative whole numbers.');return n}
function nonNeg(v,min,max){const n=Number(v);if(!Number.isInteger(n)||n<min||n>max)throw Error(`Choose a whole number from ${min} to ${max}.`);return n}
async function refresh(msg){if(!db){alert('Supabase connection failed. Reload this page.','error');return}try{const tabs=['teams','matches','players','player_performances'];const result=await Promise.all(tabs.map(k=>db.from(k).select('*')));for(let i=0;i<result.length;i++){if(result[i].error)throw result[i].error;T[tabs[i]]=result[i].data||[]}const s=await db.from('site_settings').select('*').eq('id',1).maybeSingle();if(s.error)throw s.error;if(s.data)T.settings={...D,...s.data,editor:s.data.editor||{}};T.mode='live';if(msg){T.message=msg;T.messageType='ok'}draw()}catch(e){T.mode='error';alert('Could not load tournament data: '+(e?.message||String(e)),'error')}}
async function checkAdmin(){const {data:{session},error}=await db.auth.getSession();if(error||!session){T.admin=false;T.session=null;return false}T.session=session;const res=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();T.admin=!!res.data&&!res.error;return T.admin}
async function write(query,msg){if(!T.admin)throw Error('Please sign in as an administrator.');const r=await query;if(r.error)throw r.error;await refresh(msg)}
const copy=()=>structuredClone(cms());
async function handleForm(form){const d=Object.fromEntries(new FormData(form));
 if(form.id==='login-form'){const {error}=await db.auth.signInWithPassword({email:d.email,password:d.password});if(error)throw error;const yes=await checkAdmin();if(!yes){await db.auth.signOut();throw Error('This login has not been approved as a JPCL administrator.')}await refresh('Signed in successfully.');return}
 if(!T.admin)throw Error('Please sign in before changing website data.');
 if(form.id==='settings-form'){const payload={name:d.name.trim(),short_name:d.short_name.trim().toUpperCase(),season:d.season.trim(),tagline:d.tagline.trim(),announcement:d.announcement.trim()};if(!payload.name||!payload.short_name)throw Error('Enter both names.');await write(db.from('site_settings').update(payload).eq('id',1),'Website settings saved.');return}
 if(form.id==='content-form'){const ed=copy();ed.text={...(ed.text||{})};for(const items of Object.values(TEXT_GROUPS))for(const [key] of items)ed.text[key]=String(d[key]||'').trim().slice(0,1500);await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Page content published.');return}
 if(form.id==='design-form'){if((d.logo&&!imageURL(d.logo))||(d.heroImage&&!imageURL(d.heroImage)))throw Error('Use a public HTTPS URL for each image.');const ed=copy();ed.theme={accent:color(d.accent),paper:color(d.paper),dark:color(d.dark),logo:imageURL(d.logo),heroImage:imageURL(d.heroImage)};await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Design published.');return}
 if(form.id==='nav-form'){const ed=copy();ed.nav={};for(const [id,label] of BASE_NAV)ed.nav[id]={label:String(d['label_'+id]||label).trim().slice(0,40),visible:!!d['show_'+id]};await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Menu updated.');return}
 if(form.id==='page-form'){const title=String(d.title||'').trim().slice(0,70);if(!title)throw Error('Enter a page title.');const ed=copy();let id=T.editingPage||'custom_'+Math.random().toString(36).slice(2,12);ed.pages=(ed.pages||[]).filter(p=>p.id!==id).concat([{id,title,body:String(d.body||'').trim().slice(0,15000),visible:!!d.visible}]);T.editingPage=null;await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Page published.');return}
 if(form.id==='team-form'){const name=d.name.trim(),short_name=d.short_name.trim().toUpperCase();if(!name||short_name.length<2||short_name.length>5)throw Error('Team needs a name and a 2–5 character code.');const payload={name,short_name,color:color(d.color)};let id=T.edits.teams;T.edits.teams='';await write(id?db.from('teams').update(payload).eq('id',id):db.from('teams').insert(payload),id?'Team updated.':'Team added.');return}
 if(form.id==='player-form'){const name=String(d.name||'').trim(),role=String(d.role||'').trim()||'Player';if(!name||!T.teams.some(t=>t.id===d.team_id))throw Error('Choose a team and player name.');const payload={name,role,team_id:d.team_id};let id=T.edits.players;T.edits.players='';await write(id?db.from('players').update(payload).eq('id',id):db.from('players').insert(payload),id?'Player updated.':'Player added.');return}
 if(form.id==='fixture-form'){if(!d.team1_id||!d.team2_id||d.team1_id===d.team2_id)throw Error('Choose two different teams.');const payload={team1_id:d.team1_id,team2_id:d.team2_id,stage:String(d.stage||'').trim()||'Round 1',scheduled_at:d.scheduled_at?new Date(d.scheduled_at).toISOString():null};let id=T.edits.matches;T.edits.matches='';await write(id?db.from('matches').update(payload).eq('id',id):db.from('matches').insert(payload),id?'Fixture updated.':'Fixture created.');return}
 if(form.id==='result-form'){const m=T.matches.find(x=>x.id===d.match_id);if(!m)throw Error('Choose a valid match.');if(d.winner_id&&![m.team1_id,m.team2_id].includes(d.winner_id))throw Error('Winner must be a participating team.');const payload={status:d.status,team1_runs:numeric(d.team1_runs),team2_runs:numeric(d.team2_runs),team1_wickets:numeric(d.team1_wickets,10),team2_wickets:numeric(d.team2_wickets,10),team1_overs:d.team1_overs===''?null:Number(d.team1_overs),team2_overs:d.team2_overs===''?null:Number(d.team2_overs),winner_id:d.winner_id||null,result_summary:String(d.result_summary||'').trim()};if(!['upcoming','live','completed'].includes(payload.status))throw Error('Choose a match status.');if([payload.team1_overs,payload.team2_overs].some(v=>v!=null&&(!Number.isFinite(v)||v<0||v>999.5)))throw Error('Enter a valid number of overs.');if(payload.status==='completed'&&(payload.team1_runs===null||payload.team2_runs===null))throw Error('Enter both scores before marking completed.');await write(db.from('matches').update(payload).eq('id',m.id),'Match result published.');return}
 if(form.id==='stats-form'){if(!d.match_id||!d.player_id)throw Error('Choose a match and player.');const m=T.matches.find(x=>x.id===d.match_id),p=T.players.find(x=>x.id===d.player_id);if(!m||!p||![m.team1_id,m.team2_id].includes(p.team_id))throw Error('Player must belong to a team in the selected match.');const payload={match_id:d.match_id,player_id:d.player_id,runs:nonNeg(d.runs,0,9999),wickets:nonNeg(d.wickets,0,10),catches:nonNeg(d.catches,0,10)};await write(db.from('player_performances').upsert(payload,{onConflict:'match_id,player_id'}),'Player statistics saved.');return}
 if(form.id==='round-form'){const n=String(d.round_name||'').trim().slice(0,80);if(!n||rounds().some(r=>r.toLowerCase()===n.toLowerCase()))throw Error('Enter a new round name.');const ed=copy();ed.rounds=[...(ed.rounds||[]),n];await write(db.from('site_settings').update({editor:ed}).eq('id',1),'New round table created.');return}
 if(form.id==='rules-form'){const ed=copy();ed.scoring={win:nonNeg(d.win,0,100),tie:nonNeg(d.tie,0,100)};ed.showCombined=!!d.show_combined;await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Points rules saved.');return}
 if(form.id==='adjust-form'){if(!rounds().some(x=>x===d.stage)||!T.teams.some(x=>x.id===d.team_id))throw Error('Choose a valid round and team.');const val=Number(d.delta);if(!Number.isInteger(val)||val<-100||val>100)throw Error('Enter a value from -100 to 100.');const ed=copy();ed.adjustments=ed.adjustments||{};const stage=d.stage.toLowerCase();ed.adjustments[stage]=ed.adjustments[stage]||{};if(val)ed.adjustments[stage][d.team_id]=val;else delete ed.adjustments[stage][d.team_id];await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Points adjustment saved.');return}
}
async function handleAction(action,id){
 if(action==='menu'){T.menu=!T.menu;draw();return}
 if(action==='logout'){await db.auth.signOut();T.admin=false;T.session=null;go('overview');return}
 if(action==='cancel-edit'){T.edits[id]='';draw();return}
 if(action==='cancel-page'){T.editingPage=null;draw();return}
 if(action==='add-player-team'){T.edits.defaultTeam=id;T.tab='players';draw();return}
 if(action==='score-match'){T.selectedMatch=id;T.tab='results';draw();return}
 if(action==='edit'){const [table,rowId]=id.split(':');if(!['teams','matches','players'].includes(table))return;T.edits[table]=rowId;T.tab=table==='matches'?'fixtures':table;draw();return}
 if(action==='edit-stat'){const p=T.player_performances.find(x=>x.id===id);if(!p)return;T.tab='stats';T.edits.statMatch=p.match_id;T.edits.statPlayer=p.player_id;draw();const f=$('stats-form');for(const k of ['runs','wickets','catches'])f.elements[k].value=p[k];return}
 if(action==='edit-page'){T.editingPage=id;T.tab='pages';draw();return}
 if(action==='delete-page'){if(!confirm('Delete this information page?'))return;const ed=copy();ed.pages=(ed.pages||[]).filter(p=>p.id!==id);await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Information page deleted.');return}
 if(action==='delete-round'){if(!confirm('Remove this standalone round table? Fixture results will not be deleted.'))return;const ed=copy();ed.rounds=(ed.rounds||[]).filter(x=>x!==id);await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Standalone round removed.');return}
 if(action==='remove-adjust'){const i=id.indexOf('|');if(i<0)return;const stage=id.slice(0,i),tid=id.slice(i+1);const ed=copy();if(ed.adjustments?.[stage])delete ed.adjustments[stage][tid];await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Points correction removed.');return}
 if(action==='delete'){const [table,rowId]=id.split(':');if(!['teams','matches','players','player_performances'].includes(table)||!rowId)return;if(!confirm(`Delete this ${table.slice(0,-1)}? This cannot be undone.`))return;await write(db.from(table).delete().eq('id',rowId),'Record deleted.');return}
}
document.addEventListener('click',async ev=>{const btn=ev.target.closest('button,[data-page]');if(!btn)return;try{if(btn.dataset.page){ev.preventDefault();go(btn.dataset.page);return}if(btn.dataset.tab){T.tab=btn.dataset.tab;T.message='';draw();return}if(btn.dataset.filter){T.filter=btn.dataset.filter;draw();return}if(btn.dataset.action){ev.preventDefault();await handleAction(btn.dataset.action,btn.dataset.id||'')}}catch(e){alert(e.message||String(e),'error')}});
document.addEventListener('submit',async ev=>{if(!ev.target.matches('form'))return;ev.preventDefault();const form=ev.target,btn=form.querySelector('button[type="submit"]');if(btn){btn.disabled=true;btn.dataset.prev=btn.textContent;btn.textContent='Saving…'}try{await handleForm(form)}catch(e){alert(e.message||String(e),'error')}finally{if(btn?.isConnected){btn.disabled=false;btn.textContent=btn.dataset.prev||'Save'}}});
document.addEventListener('change',ev=>{if(ev.target.name==='match_id'&&ev.target.form?.id==='result-form'){T.selectedMatch=ev.target.value;draw()}});
async function init(){draw();if(!window.supabase?.createClient){T.mode='error';alert('Database library failed to load. Check the internet connection and refresh.','error');return}try{db=window.supabase.createClient(URL,KEY);await refresh();await checkAdmin();draw()}catch(e){T.mode='error';alert('Database unavailable: '+(e.message||String(e)),'error')}}
init();
})();
</script></body></html>
