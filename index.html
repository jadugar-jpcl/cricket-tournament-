/* JWCL identity: display all four letters without clipping */
.mark{min-width:53px;width:53px;height:43px;font-size:15px;letter-spacing:-.25px;white-space:nowrap}
.mark img{max-width:100%}
/* Round + group tables */
.group-table{padding:0 0 13px;border-bottom:1px solid var(--line)}
.group-table:last-child{border-bottom:0}
.group-heading{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#f7f9fc;gap:12px}
.group-heading strong{font:900 23px 'Barlow Condensed',sans-serif;color:#18263d;text-transform:uppercase}
.group-heading span{font-size:11px;font-weight:800;color:#7d8ca2}
.round-summary{font:700 11px 'DM Sans',sans-serif;color:#748197;margin-left:8px}
.standings{min-width:670px}.standings .nrr{font-variant-numeric:tabular-nums;font-weight:900;color:#426d31}
.round-switch{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.round-switch button{border:1px solid #2a3852;background:#101a2e;border-radius:9px;padding:9px 12px;color:#c6d3e8;font-size:12px;font-weight:900}
.round-switch button.active{background:#233716;color:#c9f4a1;border-color:#4d7538}
.group-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.group-chip{display:inline-flex;align-items:center;gap:9px;border-radius:8px;padding:4px 4px 4px 12px;background:#203119;font-size:12px;font-weight:900;color:#c9f4a1;border:1px solid #355227}
.group-chip .btn{padding:2px 7px}
.assignment-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.assignment-row{border:1px solid #27354d;border-radius:10px;padding:11px;background:#0d1729}
.assignment-row strong{display:block;font-size:12px;margin-bottom:8px}
.assignment-row .field label{font-size:10px}
.manual-editor{scroll-margin-top:95px;border:2px solid #b5dc7d}
@media(max-width:410px){.mark{width:48px;min-width:48px;font-size:14px}}

.edit-shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0 15px}.edit-shortcuts .btn{padding:7px 10px;font-size:11px}

html{scroll-behavior:auto!important}

.admin-layout,.admin-layout>div,.form-card,.group-table,.table-scroll{min-width:0;max-width:100%}
@media(max-width:1030px){.admin-layout{grid-template-columns:minmax(0,1fr)}}

.swipe-hint{font-size:10px;text-align:right;color:#72859d;padding:7px 14px 0;font-weight:800;display:none}
@media(max-width:720px){.swipe-hint{display:block}}

/* JWCL rulebook: official numbered regulations */
.rules-public-card{padding:12px 22px}
.rules-public-list{padding:0;margin:0;list-style:none;counter-reset:none}
.rule-public-item{display:flex;gap:16px;align-items:flex-start;padding:18px 3px;border-bottom:1px solid var(--line)}
.rule-public-item:last-child{border-bottom:0}
.rule-number{display:grid;place-items:center;flex:0 0 37px;min-width:37px;height:37px;border-radius:11px;background:#233716;color:#c9f4a1;font:900 20px 'Barlow Condensed',sans-serif;border:1px solid #486c35}
.rule-content{font-size:14px;line-height:1.7;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;padding:6px 0}
.rules-footer{font-size:11px;color:#71829b;font-weight:800;margin:13px 5px}
.rule-admin-list{display:flex;flex-direction:column;gap:9px}
.rule-admin-item{display:flex;align-items:center;gap:12px;background:#0d1729;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.rule-admin-text{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;font-size:12px;font-weight:700;color:#dbe7f8;line-height:1.55}
.rule-admin-item .ctrl{flex-shrink:0}
@media(max-width:620px){.rules-public-card{padding:6px 12px}.rule-public-item{gap:11px;padding:15px 0}.rule-number{min-width:31px;flex-basis:31px;height:31px;font-size:17px}.rule-content{font-size:13px;padding-top:4px}.rule-admin-item{align-items:flex-start;flex-wrap:wrap}.rule-admin-item .rule-admin-text{flex:1 1 calc(100% - 55px)}.rule-admin-item .ctrl{width:100%;justify-content:flex-start;padding-left:43px}}

/* JWCL Player rankings: two concise Top 10 tables, horizontally scrollable on phones. */
.leader-section{border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:var(--shadow);margin:22px 0;overflow:hidden}
.leader-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px 18px;border-bottom:1px solid var(--line)}
.leader-head h2{font:900 30px 'Barlow Condensed',sans-serif;margin:1px 0 5px;letter-spacing:.3px}
.leader-head p{margin:0;font-size:12px;color:var(--sub);line-height:1.6}
.leader-eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:900;color:#5d8c23}
.leader-count{font-size:10px;white-space:nowrap;background:#203119;color:#c9f4a1;border-radius:100px;padding:7px 10px;font-weight:900;border:1px solid #486c35}
.leader-swipe-hint{color:#9fb1c9;font-size:11px;padding:8px 18px;font-weight:700;background:#0d1729}
.leader-table-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.leader-table{border-collapse:collapse;min-width:930px;width:100%;font-size:12px}
.leader-table th{text-align:center;padding:13px 10px;background:#132136;color:#aebbd0;letter-spacing:.7px;font-size:10px;white-space:nowrap}
.leader-table td{border-top:1px solid #1e2a40;padding:12px 10px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.leader-table tr:nth-child(2n){background:#0d1729}
.leader-table th:nth-child(2),.leader-table td:nth-child(2){text-align:left}
.leader-table .leader-name{font-weight:900;color:#f1f6ff}
.leader-table .leader-primary{font-weight:900;color:#c9f4a1;background:#182513}
.leader-table .leader-rank{color:#8392a8;font-weight:800}
@media(max-width:600px){.leader-head{padding:17px 15px}.leader-head h2{font-size:27px}.leader-head p{font-size:11px}.leader-table{min-width:820px}}

body, .main{background:var(--bg)}
.metric b,.section-title h2,.pagehead h1,.squad-head strong,.footer strong,.form-card h3,.form-card h4,.auth-card h2{color:var(--text)}
.match-top,.match-bottom,.pagehead p,.form-card p,.footer p,.footer small,.team-tile small,.squad-head small,.standings th,.leader-head p{color:var(--sub)}
.match,.squad-head,.squad-list li,.rule-public-item,.leader-head,.leader-table td,.leader-table th,.stat-row,.form-card h4{border-color:var(--line)}
.standings td,.leader-table td,.rule-content,.prose,.form-card,.card,.metric,.pagehead,.team-tile b,.squad-list li b,.stat-row strong,.admin-header h2,.admin-menu button,.round-summary,.group-title,.rule-content{color:var(--text)}

 'Footer and metadata':[['footer','Footer credit','Managed by JWCL.'],['announcementTitle','Announcement heading','LEAGUE ANNOUNCEMENT'],['seo','Search engine description','JWCL official cricket tournament fixtures, results, teams and rankings.']]
};
const BASE_NAV=[['overview','Home'],['matches','Matches'],['standings','Points Table'],['teams','Teams'],['players','Player Stats'],['rules','Rules']];
const T={page:'overview',menu:false,tab:'results',filter:'all',admin:false,session:null,mode:'loading',message:'',messageType:'ok',settings:{...D},teams:[],matches:[],players:[],player_performances:[],edits:{},selectedMatch:'',editingPage:null,activeRound:'',editingStanding:'',editingRule:'',editingBat:'',editingBowl:''};
let db=null;
const cfg=()=>T.settings;
const cms=()=>cfg().editor||{};
const tx=(key)=>{for(const items of Object.values(TEXT_GROUPS)){const item=items.find(x=>x[0]===key);if(item)return String(cms().text?.[key]??item[2]);}return ''};

// JWCL Rules are structured, automatically numbered and persisted in site_settings.editor.
const rulebook=()=>cms().rulebook||{};
const listRules=()=>Array.isArray(rulebook().items)?rulebook().items.filter(r=>r&&typeof r.id==='string'&&typeof r.text==='string'):[];
const ruleTitle=()=>String(rulebook().title||'JWCL TOURNAMENT RULES');
const ruleIntro=()=>String(rulebook().intro??'Official rules and regulations for the Jadugar World Cricket League.');
const ruleLimit=60;
const newRuleId=()=>('rule_'+Math.random().toString(36).slice(2,13));
const saveRulebook=async(next,message)=>{const ed=copy();ed.rulebook=next;T.editingRule='';await write(db.from('site_settings').update({editor:ed}).eq('id',1),message)};
const ruleItem=(r,i)=>`<li class="rule-public-item"><span class="rule-number">${i+1}</span><div class="rule-content">${esc(r.text)}</div></li>`;
const nav=()=>[...BASE_NAV.map(([id,label])=>({id,label:cms().nav?.[id]?.label||label,visible:cms().nav?.[id]?.visible!==false})),...(cms().pages||[]).filter(x=>x&&/^custom_[a-z0-9_]+$/.test(x.id)).map(p=>({id:p.id,label:p.title,visible:p.visible!==false}))];
const team=id=>T.teams.find(x=>x.id===id)||{name:'Unknown',short_name:'?',color:'#e4e8ed'};
const player=id=>T.players.find(x=>x.id===id)||{name:'Unknown'};
const short=t=>esc(t.short_name||'?');
const roundKey=round=>String(round||'').trim().toLowerCase();
const groupData=round=>cms().groupings?.[roundKey(round)]||{groups:[],assignments:{}};
const groupNames=round=>Array.isArray(groupData(round).groups)?groupData(round).groups:[];
const assignedGroup=(round,tid)=>groupData(round).assignments?.[tid]||'';
const hasGroups=round=>groupNames(round).length>0;
const groupTeamIds=(round,group)=>T.teams.filter(t=>assignedGroup(round,t.id)===group).map(t=>t.id);
const manualFor=(round,tid)=>cms().manualTables?.[roundKey(round)]?.[tid]||{};
const numericManual=(value,min,max,label)=>{if(value===''||value==null)return null;const num=Number(value);if(!Number.isInteger(num)||num<min||num>max)throw Error(label+' must be a whole number between '+min+' and '+max);return num;};
const validNRR=value=>{if(value===''||value==null)return null;const n=Number(value);if(!Number.isFinite(n)||n<-99.999||n>99.999||!/^[-+]?\d+(?:\.\d{1,3})?$/.test(String(value)))throw Error('NRR must be a number with up to 3 decimals.');return Math.round(n*1000)/1000;};
const nrrLabel=value=>value==null?'—':Number(value).toFixed(3);

const dateStr=s=>s?new Date(s).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Date TBA';
const scored=m=>m.status==='completed';
const rounds=()=>{
 let map=new Map();for(const m of T.matches){const st=String(m.stage||'Round 1').trim();if(st&&!/^(final|semi.?final|quarter.?final|playoffs?|knockout)$/i.test(st))map.set(st.toLowerCase(),st)}
 for(const r of cms().rounds||[]){if(typeof r==='string'&&r.trim())map.set(r.trim().toLowerCase(),r.trim())}
 return [...map.values()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
};
const pointValue=k=>Number(cms().scoring?.[k]??(k==='win'?2:1));
const calcTable=(matches,stage,combined=false,allowedIds=null)=>{
 const eligible=new Set(allowedIds||matches.flatMap(m=>[m.team1_id,m.team2_id]));
 if(allowedIds===null&&!matches.length)T.teams.forEach(t=>eligible.add(t.id));
 const extras=cms().adjustments||{};
 const stages=combined?rounds().map(x=>roundKey(x)):[roundKey(stage)];
 if(allowedIds===null)for(const st of stages)for(const tid of Object.keys(extras[st]||{}))eligible.add(tid);
 const map=new Map(T.teams.filter(t=>eligible.has(t.id)).map(t=>[t.id,{team:t,p:0,w:0,l:0,t:0,pts:0,nrr:null}]));
 for(const m of matches.filter(scored)){
  const a=map.get(m.team1_id),b=map.get(m.team2_id);
  if(a){a.p++;if(m.winner_id===m.team1_id){a.w++;a.pts+=pointValue('win')}else if(m.winner_id===m.team2_id){a.l++}else{a.t++;a.pts+=pointValue('tie')}}
  if(b){b.p++;if(m.winner_id===m.team2_id){b.w++;b.pts+=pointValue('win')}else if(m.winner_id===m.team1_id){b.l++}else{b.t++;b.pts+=pointValue('tie')}}
 }
 for(const st of stages)for(const [tid,bonus] of Object.entries(extras[st]||{})){const row=map.get(tid);if(row)row.pts+=Number(bonus)||0}
 if(!combined)for(const [tid,row] of map){const fixed=manualFor(stage,tid);for(const field of ['p','w','l','t','pts','nrr'])if(fixed[field]!==null&&fixed[field]!==undefined)row[field]=Number(fixed[field]);}
 return [...map.values()].sort((a,b)=>b.pts-a.pts||(Number(b.nrr??-999)-Number(a.nrr??-999))||b.w-a.w||a.team.name.localeCompare(b.team.name));
};
const roundMatches=r=>T.matches.filter(m=>roundKey(m.stage)===roundKey(r));
const groupedTables=(stage,admin=false)=>{
 const matches=roundMatches(stage);
 if(!hasGroups(stage)){const rows=calcTable(matches,stage);return table(rows,admin);}
 const groups=groupNames(stage);
 const assigned=new Set(Object.values(groupData(stage).assignments||{}).filter(Boolean));
 return groups.map(g=>{const ids=groupTeamIds(stage,g);const rows=calcTable(matches,stage,false,ids);return `<section class="group-table"><div class="group-heading"><strong>${esc(g)}</strong><span>${ids.length} teams</span></div>${table(rows,admin)}${admin&&ids.length===0?'<p class="adminhint">Assign teams to this group below.</p>':''}</section>`}).join('');
};
const allCompleted=()=>T.matches.filter(scored);
const sortedMatches=()=>[...T.matches].sort((a,b)=>String(a.scheduled_at||a.created_at||'').localeCompare(String(b.scheduled_at||b.created_at||'')));
// Public top ten rankings are stored as structured admin edits, independently of team and match data.
// Batting: avg = runs / dismissals, SR = runs / balls * 100.
// Bowling: econ = runs conceded / (balls / 6), with cricket overs such as 4.3 meaning 4 overs and 3 balls.
const leaderboard=()=>cms().leaderboards||{};
const battingRecords=()=>leaderboard().batting||{};
const bowlingRecords=()=>leaderboard().bowling||{};
const rankedPlayers=kind=>{
 const data=kind==='batting'?battingRecords():bowlingRecords();
 return Object.entries(data).filter(([id,r])=>T.players.some(p=>p.id===id)&&r&&typeof r==='object')
  .map(([id,rec])=>({p:player(id),team:team(player(id).team_id),...rec,id}))
  .sort((a,b)=>kind==='batting'?(Number(b.runs||0)-Number(a.runs||0)||Number(b.highScore||0)-Number(a.highScore||0)||a.p.name.localeCompare(b.p.name)):
   (Number(b.wickets||0)-Number(a.wickets||0)||Number(a.runsConceded||0)-Number(b.runsConceded||0)||a.p.name.localeCompare(b.p.name)));
};
const cricketBalls=value=>{const match=/^(\d+)(?:\.([0-5]))?$/.exec(String(value||'0'));return match?Number(match[1])*6+Number(match[2]||0):0};
const battingAvg=r=>Number(r.outs)>0?(Number(r.runs||0)/Number(r.outs)).toFixed(2):'—';
const battingSR=r=>Number(r.balls)>0?(100*Number(r.runs||0)/Number(r.balls)).toFixed(2):'—';
const bowlingAvg=r=>Number(r.wickets)>0?(Number(r.runsConceded||0)/Number(r.wickets)).toFixed(2):'—';
const bowlingEcon=r=>cricketBalls(r.overs)>0?(Number(r.runsConceded||0)*6/cricketBalls(r.overs)).toFixed(2):'—';
const bowlingBest=r=>Number.isInteger(Number(r.bestWickets))&&r.bestWickets!==''&&r.bestWickets!=null?`${Number(r.bestWickets)}/${Number(r.bestRuns||0)}`:'—';
const topTenTable=kind=>{
 const batting=kind==='batting';const list=rankedPlayers(kind).slice(0,10);
 if(!list.length)return empty('No '+(batting?'batting':'bowling')+' rankings published yet. Add players and enter their statistics in Admin → Player Stats.');
 const headers=batting?['#','BATSMAN','RUNS','TEAM','M','INN','BALLS','4s','6s','HS','AVG','SR']:['#','BOWLER','WKT','TEAM','M','INN','OVERS','RUNS','MDN','BEST','AVG','ECON'];
 const cols=list.map((r,i)=>{
  const cells=batting?[i+1,r.p.name,r.runs??0,r.team.short_name,r.matches??0,r.innings??0,r.balls??0,r.fours??0,r.sixes??0,r.highScore??0,battingAvg(r),battingSR(r)]:
   [i+1,r.p.name,r.wickets??0,r.team.short_name,r.matches??0,r.innings??0,r.overs??'0',r.runsConceded??0,r.maidens??0,bowlingBest(r),bowlingAvg(r),bowlingEcon(r)];
  return `<tr>${cells.map((x,j)=>`<td class="${j===1?'leader-name':j===0?'leader-rank':j===2?'leader-primary':''}">${esc(x)}</td>`).join('')}</tr>`;
 }).join('');
 return `<div class="leader-swipe-hint">Swipe sideways to see all statistics →</div><div class="leader-table-scroll"><table class="leader-table"><thead><tr>${headers.map(v=>`<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${cols}</tbody></table></div>`;
};
const leaderboardField=(label,key,val='',max=9999)=>f(label,key,val,'number',`required min="0" max="${max}" step="1"`);

 T.editingBat='';T.editingBowl='';

};

function home(){const m=T.matches.find(m=>m.status==='live')||T.matches.find(m=>m.status==='upcoming')||T.matches[0];const completed=sortedMatches().filter(scored).reverse().slice(0,3);const upcoming=sortedMatches().filter(m=>m.status!=='completed').slice(0,3);const rnd=rounds()[0];return `<section class="hero">${imageURL(cms().theme?.heroImage)?`<img class="hero-photo" src="${esc(imageURL(cms().theme.heroImage))}" alt="">`:''}<div class="container hero-in"><div><div class="eyebrow">${text('heroEyebrow')}</div><h1>${text('hero1')}<br>${text('hero2')}<br><em>${text('hero3')}</em></h1><p>${text('heroDescription')}</p><div class="actions"><button class="btn primary" data-page="matches">${text('heroAction1')} ↗</button><button class="btn outline" data-page="standings">${text('heroAction2')} →</button></div></div><div class="feature"><span class="micro">THE MATCH CENTRE</span><h2>${m?esc(m.stage):'COMING SOON'}</h2>${m?`<div class="versus"><b>${esc(team(m.team1_id).short_name)}</b><em>VS</em><b>${esc(team(m.team2_id).short_name)}</b></div><p>${esc(dateStr(m.scheduled_at))} · ${status(m)}</p>`:'<p>Fixtures and results will appear here when the tournament starts.</p>'}</div></div></section><div class="container"><div class="metrics">${[['Teams',T.teams.length],['Matches',T.matches.length],['Completed',allCompleted().length],['Players',T.players.length]].map(([k,v])=>`<div class="metric"><b>${v}</b><span>${k}</span></div>`).join('')}</div>${cfg().announcement?`<div class="note" style="margin-top:22px"><strong>${text('announcementTitle')}:</strong> ${esc(cfg().announcement)}</div>`:''}<main class="main"><div class="grid2"><div>${section(tx('homeResults'),'OFFICIAL RESULTS',completed.length?completed.map(matchLine).join(''):empty('Results will appear once matches are played.'),'matches')}</div><div>${section(tx('homeStandings'),'THE RACE',(rnd?groupedTables(rnd):table(calcTable(T.matches,''))),'standings')}</div></div>${section(tx('homeUpcoming'),'WHAT’S NEXT',upcoming.length?upcoming.map(matchLine).join(''):empty('No upcoming fixtures yet.'),'matches')}${banner()}</main></div>`}
function matchesPage(){const list=sortedMatches().filter(m=>T.filter==='all'||m.status===T.filter);return `<main class="main"><div class="container">${pagehead(tx('matchesTitle'),tx('matchesDescription'),'THE MATCH CENTRE')}<div class="select-tabs" style="margin:14px 0">${[['all','All matches'],['upcoming','Upcoming'],['live','Live'],['completed','Results']].map(([id,label])=>`<button class="${T.filter===id?'active':''}" data-filter="${id}">${label}</button>`).join('')}</div><div class="card">${list.length?list.map(matchLine).join(''):empty('No matches for this filter yet.')}</div>${banner()}</div></main>`}

function draw(){const t=cms().theme||{};document.documentElement.style.setProperty('--accent',color(t.accent||'#7dd3fc'));document.documentElement.style.setProperty('--bg',color(t.paper||'#070f1d'));document.documentElement.style.setProperty('--dark',color(t.dark||'#050b16'));const pt=(cms().pages||[]).find(x=>x.id===T.page);document.title=`${cfg().short_name||'JWCL'} | ${pt?.title||(T.page==='overview'?'Tournament Hub':T.page)}`;const title=document.querySelector('meta[name="description"]');if(title)title.content=tx('seo');const pages={overview:home,matches:matchesPage,standings:standingsPage,teams:teamsPage,players:playersPage,rules:rulesPage,admin:adminPage};$('app').innerHTML=header()+(pages[T.page]||customPage)()+footer();}
function go(page){T.page=page;T.menu=false;T.message='';draw();scrollTo({top:0,behavior:'instant'})}
function alert(msg,type='ok'){T.message=msg;T.messageType=type;draw()}
function numeric(v,max=9999){if(v===''||v==null)return null;const n=Number(v);if(!Number.isInteger(n)||n<0||n>max)throw Error('Enter valid non-negative whole numbers.');return n}
function nonNeg(v,min,max){const n=Number(v);if(!Number.isInteger(n)||n<min||n>max)throw Error(`Choose a whole number from ${min} to ${max}.`);return n}
async function refresh(msg){if(!db){alert('Supabase connection failed. Reload this page.','error');return}try{const tabs=['teams','matches','players','player_performances'];const result=await Promise.all(tabs.map(k=>db.from(k).select('*')));for(let i=0;i<result.length;i++){if(result[i].error)throw result[i].error;T[tabs[i]]=result[i].data||[]}const s=await db.from('site_settings').select('*').eq('id',1).maybeSingle();if(s.error)throw s.error;if(s.data)T.settings={...D,...s.data,editor:s.data.editor||{}};T.mode='live';if(msg){T.message=msg;T.messageType='ok'}draw()}catch(e){T.mode='error';alert('Could not load tournament data: '+(e?.message||String(e)),'error')}}
async function checkAdmin(){const {data:{session},error}=await db.auth.getSession();if(error||!session){T.admin=false;T.session=null;return false}T.session=session;const res=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();T.admin=!!res.data&&!res.error;return T.admin}
async function write(query,msg){if(!T.admin)throw Error('Please sign in as an administrator.');const r=await query;if(r.error)throw r.error;await refresh(msg)}
const copy=()=>structuredClone(cms());
async function handleForm(form){const d=Object.fromEntries(new FormData(form));
 if(form.id==='login-form'){const {error}=await db.auth.signInWithPassword({email:d.email,password:d.password});if(error)throw error;const yes=await checkAdmin();if(!yes){await db.auth.signOut();throw Error('This login has not been approved as a JWCL administrator.')}await refresh('Signed in successfully.');return}
 if(!T.admin)throw Error('Please sign in before changing website data.');
 if(form.id==='rulebook-settings-form'){
   const title=String(d.rules_title||'').trim().slice(0,90),intro=String(d.rules_intro||'').trim().slice(0,2000);
   if(!title)throw Error('Enter a heading for the Rules page.');
   await saveRulebook({...rulebook(),title,intro},'Rules page heading updated.');return;
 }

   const content=String(d.rule_text||'').trim().slice(0,1500);

   if(T.editingRule){const rule=items.find(r=>r.id===T.editingRule);if(!rule)throw Error('Rule no longer exists.');rule.text=content;}
   else{if(items.length>=ruleLimit)throw Error('The Rules page supports up to '+ruleLimit+' points.');items.push({id:newRuleId(),text:content});}

 }
 if(form.id==='rulebook-bulk-form'){
   const entries=String(d.bulk_rules||'').split(/\r?\n/).map(s=>s.trim().replace(/^(?:rule\s*)?\d{1,3}\s*[.)\-:]\s*/i,'').trim()).filter(Boolean);
   if(!entries.length)throw Error('Paste at least one rule, one per line.');

 }
 if(form.id==='settings-form'){const payload={name:d.name.trim(),short_name:d.short_name.trim().toUpperCase(),season:d.season.trim(),tagline:d.tagline.trim(),announcement:d.announcement.trim()};if(!payload.name||!payload.short_name)throw Error('Enter both names.');await write(db.from('site_settings').update(payload).eq('id',1),'Website settings saved.');return}
 if(form.id==='content-form'){const ed=copy();ed.text={...(ed.text||{})};for(const items of Object.values(TEXT_GROUPS))for(const [key] of items)ed.text[key]=String(d[key]||'').trim().slice(0,1500);await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Page content published.');return}
 if(form.id==='design-form'){if((d.logo&&!imageURL(d.logo))||(d.heroImage&&!imageURL(d.heroImage)))throw Error('Use a public HTTPS URL for each image.');const ed=copy();ed.theme={accent:color(d.accent),paper:color(d.paper),dark:color(d.dark),logo:imageURL(d.logo),heroImage:imageURL(d.heroImage)};await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Design published.');return}
 if(form.id==='nav-form'){const ed=copy();ed.nav={};for(const [id,label] of BASE_NAV)ed.nav[id]={label:String(d['label_'+id]||label).trim().slice(0,40),visible:!!d['show_'+id]};await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Menu updated.');return}
 if(form.id==='page-form'){const title=String(d.title||'').trim().slice(0,70);if(!title)throw Error('Enter a page title.');const ed=copy();let id=T.editingPage||'custom_'+Math.random().toString(36).slice(2,12);ed.pages=(ed.pages||[]).filter(p=>p.id!==id).concat([{id,title,body:String(d.body||'').trim().slice(0,15000),visible:!!d.visible}]);T.editingPage=null;await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Page published.');return}
 if(form.id==='team-form'){const name=d.name.trim(),short_name=d.short_name.trim().toUpperCase();if(!name||short_name.length<2||short_name.length>5)throw Error('Team needs a name and a 2–5 character code.');const payload={name,short_name,color:color(d.color)};let id=T.edits.teams;T.edits.teams='';await write(id?db.from('teams').update(payload).eq('id',id):db.from('teams').insert(payload),id?'Team updated.':'Team added.');return}
 if(form.id==='player-form'){const name=String(d.name||'').trim(),role=String(d.role||'').trim()||'Player';if(!name||!T.teams.some(t=>t.id===d.team_id))throw Error('Choose a team and player name.');const payload={name,role,team_id:d.team_id};let id=T.edits.players;T.edits.players='';await write(id?db.from('players').update(payload).eq('id',id):db.from('players').insert(payload),id?'Player updated.':'Player added.');return}
 if(form.id==='fixture-form'){if(!d.team1_id||!d.team2_id||d.team1_id===d.team2_id)throw Error('Choose two different teams.');const payload={team1_id:d.team1_id,team2_id:d.team2_id,stage:String(d.stage||'').trim()||'Round 1',scheduled_at:d.scheduled_at?new Date(d.scheduled_at).toISOString():null};let id=T.edits.matches;T.edits.matches='';await write(id?db.from('matches').update(payload).eq('id',id):db.from('matches').insert(payload),id?'Fixture updated.':'Fixture created.');return}
 if(form.id==='result-form'){const m=T.matches.find(x=>x.id===d.match_id);if(!m)throw Error('Choose a valid match.');if(d.winner_id&&![m.team1_id,m.team2_id].includes(d.winner_id))throw Error('Winner must be a participating team.');const payload={status:d.status,team1_runs:numeric(d.team1_runs),team2_runs:numeric(d.team2_runs),team1_wickets:numeric(d.team1_wickets,10),team2_wickets:numeric(d.team2_wickets,10),team1_overs:d.team1_overs===''?null:Number(d.team1_overs),team2_overs:d.team2_overs===''?null:Number(d.team2_overs),winner_id:d.winner_id||null,result_summary:String(d.result_summary||'').trim()};if(!['upcoming','live','completed'].includes(payload.status))throw Error('Choose a match status.');if([payload.team1_overs,payload.team2_overs].some(v=>v!=null&&(!Number.isFinite(v)||v<0||v>999.5)))throw Error('Enter a valid number of overs.');if(payload.status==='completed'&&(payload.team1_runs===null||payload.team2_runs===null))throw Error('Enter both scores before marking completed.');await write(db.from('matches').update(payload).eq('id',m.id),'Match result published.');return}
 if(form.id==='batting-form'){
  if(!T.players.some(p=>p.id===d.player_id))throw Error('Choose a registered batsman.');
  const keys=['matches','innings','runs','balls','fours','sixes','highScore','outs'];const record={};
  for(const key of keys)record[key]=nonNeg(d[key==='matches'?'games':key],0,key==='runs'||key==='balls'?99999:key==='matches'||key==='innings'||key==='outs'?999:key==='highScore'?9999:9999);
  if(record.innings>record.matches)throw Error('Innings cannot be greater than matches.');
  if(record.outs>record.innings)throw Error('Times out cannot be greater than innings.');
  if(record.highScore>record.runs)throw Error('Highest score cannot exceed total runs.');
  await saveRanking('batting',record,d.player_id,'Batsman leaderboard updated.');return;
 }
 if(form.id==='bowling-form'){
  if(!T.players.some(p=>p.id===d.player_id))throw Error('Choose a registered bowler.');
  const rawOvers=String(d.overs||'0').trim();if(!/^[0-9]+(?:\.[0-5])?$/.test(rawOvers))throw Error('Enter overs in cricket format, such as 4.3 (4 overs and 3 balls).');
  const record={overs:rawOvers};
  for(const key of ['matches','innings','runsConceded','wickets','maidens','bestWickets','bestRuns'])
   record[key]=nonNeg(d[key==='matches'?'games':key],0,key==='runsConceded'?99999:key==='bestWickets'?10:key==='bestRuns'?9999:999);
  if(record.innings>record.matches)throw Error('Innings cannot exceed matches.');
  if(record.bestWickets>record.wickets)throw Error('Best bowling wickets cannot exceed total wickets.');
  if(record.maidens>Math.floor(cricketBalls(rawOvers)/6))throw Error('Maidens cannot exceed completed overs.');
  await saveRanking('bowling',record,d.player_id,'Bowler leaderboard updated.');return;
 }
 if(form.id==='stats-form'){if(!d.match_id||!d.player_id)throw Error('Choose a match and player.');const m=T.matches.find(x=>x.id===d.match_id),p=T.players.find(x=>x.id===d.player_id);if(!m||!p||![m.team1_id,m.team2_id].includes(p.team_id))throw Error('Player must belong to a team in the selected match.');const payload={match_id:d.match_id,player_id:d.player_id,runs:nonNeg(d.runs,0,9999),wickets:nonNeg(d.wickets,0,10),catches:T.player_performances.find(x=>x.match_id===d.match_id&&x.player_id===d.player_id)?.catches??0};await write(db.from('player_performances').upsert(payload,{onConflict:'match_id,player_id'}),'Player statistics saved.');return}

 if(form.id==='new-group-form'){
  const round=rounds().find(x=>roundKey(x)===roundKey(d.round)),name=String(d.group_name||'').trim().slice(0,40);
  if(!round||!name)throw Error('Choose a valid round and enter a group name.');
  const ed=copy();ed.groupings=ed.groupings||{};const key=roundKey(round);
  const grouping=ed.groupings[key]||{groups:[],assignments:{}};
  if(grouping.groups.some(g=>g.toLowerCase()===name.toLowerCase()))throw Error('This group already exists in this round.');
  grouping.groups=[...grouping.groups,name];ed.groupings[key]=grouping;T.activeRound=round;
  await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Group added.');return;
 }
 if(form.id==='assign-groups-form'){
  const round=rounds().find(x=>roundKey(x)===roundKey(d.round));if(!round||!hasGroups(round))throw Error('Create the round groups first.');
  const ed=copy(),key=roundKey(round),grouping=ed.groupings[key];const assignments={};
  for(const t of T.teams){const g=String(d['assigned_'+t.id]||'');if(g&&!grouping.groups.includes(g))throw Error('Invalid group for '+t.name);if(g)assignments[t.id]=g;}
  grouping.assignments=assignments;T.activeRound=round;T.editingStanding='';
  await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Team group assignments saved.');return;
 }
 if(form.id==='manual-values-form'){
  const round=rounds().find(x=>roundKey(x)===roundKey(d.round)),tid=d.team_id;
  if(!round||!T.teams.some(t=>t.id===tid))throw Error('Select a valid round and team.');
  if(hasGroups(round)&&!groupNames(round).includes(assignedGroup(round,tid)))throw Error('Assign this team to a group before editing.');
  const row={};for(const key of ['p','w','l','t']){const v=numericManual(d[key],0,999,key.toUpperCase());if(v!==null)row[key]=v;}
  const pts=numericManual(d.pts,-999,9999,'Points');if(pts!==null)row.pts=pts;
  const nrr=validNRR(d.nrr);if(nrr!==null)row.nrr=nrr;
  const ed=copy(),key=roundKey(round);ed.manualTables=ed.manualTables||{};ed.manualTables[key]=ed.manualTables[key]||{};
  if(Object.keys(row).length)ed.manualTables[key][tid]=row;else delete ed.manualTables[key][tid];
  T.activeRound=round;T.editingStanding='';
  await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Team standings saved.');return;
 }
 if(form.id==='round-form'){const n=String(d.round_name||'').trim().slice(0,80);if(!n||rounds().some(r=>r.toLowerCase()===n.toLowerCase()))throw Error('Enter a new round name.');const ed=copy();ed.rounds=[...(ed.rounds||[]),n];await write(db.from('site_settings').update({editor:ed}).eq('id',1),'New round table created.');return}
 if(form.id==='rules-form'){const ed=copy();ed.scoring={win:nonNeg(d.win,0,100),tie:nonNeg(d.tie,0,100)};ed.showCombined=!!d.show_combined;await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Points rules saved.');return}
 if(form.id==='adjust-form'){if(!rounds().some(x=>x===d.stage)||!T.teams.some(x=>x.id===d.team_id))throw Error('Choose a valid round and team.');const val=Number(d.delta);if(!Number.isInteger(val)||val<-100||val>100)throw Error('Enter a value from -100 to 100.');const ed=copy();ed.adjustments=ed.adjustments||{};const stage=d.stage.toLowerCase();ed.adjustments[stage]=ed.adjustments[stage]||{};if(val)ed.adjustments[stage][d.team_id]=val;else delete ed.adjustments[stage][d.team_id];await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Points adjustment saved.');return}
}
async function handleAction(action,id){
 if(action==='menu'){T.menu=!T.menu;draw();return}
 if(action==='switch-round'){T.activeRound=id;T.editingStanding='';draw();return}
 if(action==='edit-standing'){if(!T.teams.some(t=>t.id===id))return;T.editingStanding=id;draw();const form=$('manual-values-form');form?.scrollIntoView({block:'center',behavior:'instant'});return}
 if(action==='cancel-standing'){T.editingStanding='';draw();return}
 if(action==='delete-group'){
  if(!T.admin)throw Error('Admin access required.');
  const [round,group]=id.split('|').map(decodeURIComponent);if(!groupNames(round).includes(group))return;
  if(!confirm('Delete '+group+' from '+round+'? Teams in this group will become unassigned.'))return;
  const ed=copy(),key=roundKey(round),g=ed.groupings[key];
  g.groups=g.groups.filter(x=>x!==group);for(const [tid,name] of Object.entries(g.assignments||{}))if(name===group)delete g.assignments[tid];
  T.activeRound=round;T.editingStanding='';await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Group removed.');return;
 }

 if(action==='edit-leader'){
  const split=id.indexOf('|'),kind=id.slice(0,split),pid=id.slice(split+1);
  if(!['batting','bowling'].includes(kind)||!T.players.some(p=>p.id===pid))return;
  if(kind==='batting')T.editingBat=pid;else T.editingBowl=pid;
  T.tab='stats';draw();$(kind+'-form')?.scrollIntoView({block:'center',behavior:'instant'});return;
 }
 if(action==='cancel-leader'){if(id==='batting')T.editingBat='';else T.editingBowl='';draw();return;}
 if(action==='remove-leader'){
  const split=id.indexOf('|'),kind=id.slice(0,split),pid=id.slice(split+1);
  if(!['batting','bowling'].includes(kind)||!T.players.some(p=>p.id===pid))return;
  if(!confirm('Remove this player from the '+(kind==='batting'?'batsmen':'bowlers')+' top-10 list? They will remain in their team.'))return;
  const ed=copy();ed.leaderboards=ed.leaderboards||{};ed.leaderboards[kind]={...(ed.leaderboards[kind]||{})};delete ed.leaderboards[kind][pid];
  await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Player removed from '+kind+' leaderboard.');return;
 }
 if(action==='edit-rule'){if(!listRules().some(r=>r.id===id))return;T.editingRule=id;T.tab='rulebook';draw();$('rulebook-item-form')?.scrollIntoView({block:'center',behavior:'instant'});return}
 if(action==='cancel-rule'){T.editingRule='';draw();return}
 if(action==='delete-rule'){if(!confirm('Delete this tournament rule?'))return;const items=listRules().filter(r=>r.id!==id);await saveRulebook({...rulebook(),items},'Rule deleted.');return}
 if(action==='rule-up'||action==='rule-down'){
   const items=listRules().map(r=>({...r}));const a=items.findIndex(r=>r.id===id),b=a+(action==='rule-up'?-1:1);
   if(a<0||b<0||b>=items.length)return;
   [items[a],items[b]]=[items[b],items[a]];
   await saveRulebook({...rulebook(),items},'Rules reordered.');return;
 }
 if(action==='logout'){await db.auth.signOut();T.admin=false;T.session=null;go('overview');return}
 if(action==='cancel-edit'){T.edits[id]='';draw();return}
 if(action==='cancel-page'){T.editingPage=null;draw();return}
 if(action==='add-player-team'){T.edits.defaultTeam=id;T.tab='players';draw();return}
 if(action==='score-match'){T.selectedMatch=id;T.tab='results';draw();return}
 if(action==='edit'){const [table,rowId]=id.split(':');if(!['teams','matches','players'].includes(table))return;T.edits[table]=rowId;T.tab=table==='matches'?'fixtures':table;draw();return}
 if(action==='edit-stat'){const p=T.player_performances.find(x=>x.id===id);if(!p)return;T.tab='stats';T.edits.statMatch=p.match_id;T.edits.statPlayer=p.player_id;draw();const f=$('stats-form');for(const k of ['runs','wickets'])f.elements[k].value=p[k];return}
 if(action==='edit-page'){T.editingPage=id;T.tab='pages';draw();return}
 if(action==='delete-page'){if(!confirm('Delete this information page?'))return;const ed=copy();ed.pages=(ed.pages||[]).filter(p=>p.id!==id);await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Information page deleted.');return}
 if(action==='delete-round'){if(!confirm('Remove this standalone round table? Fixture results will not be deleted.'))return;const ed=copy();ed.rounds=(ed.rounds||[]).filter(x=>x!==id);await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Standalone round removed.');return}
 if(action==='remove-adjust'){const i=id.indexOf('|');if(i<0)return;const stage=id.slice(0,i),tid=id.slice(i+1);const ed=copy();if(ed.adjustments?.[stage])delete ed.adjustments[stage][tid];await write(db.from('site_settings').update({editor:ed}).eq('id',1),'Points correction removed.');return}
 if(action==='delete'){const [table,rowId]=id.split(':');if(!['teams','matches','players','player_performances'].includes(table)||!rowId)return;if(!confirm(`Delete this ${table.slice(0,-1)}? This cannot be undone.`))return;await write(db.from(table).delete().eq('id',rowId),'Record deleted.');return}
}
document.addEventListener('click',async ev=>{const btn=ev.target.closest('button,[data-page]');if(!btn)return;try{if(btn.dataset.page){ev.preventDefault();go(btn.dataset.page);return}if(btn.dataset.tab){T.tab=btn.dataset.tab;T.message='';draw();return}if(btn.dataset.filter){T.filter=btn.dataset.filter;draw();return}if(btn.dataset.action){ev.preventDefault();await handleAction(btn.dataset.action,btn.dataset.id||'')}}catch(e){alert(e.message||String(e),'error')}});
document.addEventListener('submit',async ev=>{if(!ev.target.matches('form'))return;ev.preventDefault();const form=ev.target,btn=form.querySelector('button[type="submit"]');if(btn){btn.disabled=true;btn.dataset.prev=btn.textContent;btn.textContent='Saving…'}try{await handleForm(form)}catch(e){alert(e.message||String(e),'error')}finally{if(btn?.isConnected){btn.disabled=false;btn.textContent=btn.dataset.prev||'Save'}}});
document.addEventListener('change',ev=>{if(ev.target.name==='match_id'&&ev.target.form?.id==='result-form'){T.selectedMatch=ev.target.value;draw()}});
async function init(){draw();if(!window.supabase?.createClient){T.mode='error';alert('Database library failed to load. Check the internet connection and refresh.','error');return}try{db=window.supabase.createClient(URL,KEY);await refresh();await checkAdmin();draw()}catch(e){T.mode='error';alert('Database unavailable: '+(e.message||String(e)),'error')}}
init();
})();
